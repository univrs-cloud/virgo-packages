name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-24.04
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Install dependencies
        run: sudo apt update && sudo apt install -y jq gnupg apt-utils curl gzip
      
      - name: Import GPG private key
        run: |
          gpg --batch --import <<EOF
          $GPG_PRIVATE_KEY
          EOF
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE }}
      
      - name: Download virgo-api .deb
        run: |
          curl -s https://api.github.com/repos/univrs-cloud/virgo-api/releases/latest \
          | jq -r '.assets[] | select(.name | endswith("_arm64.deb")) | .browser_download_url' \
          | xargs -I{} sh -c 'curl -L -o dists/stable/main/binary-arm64/$(basename "{}") "{}"'
      
      - name: Download virgo-ui .deb
        run: |
          curl -s https://api.github.com/repos/univrs-cloud/virgo-ui/releases/latest \
          | jq -r '.assets[] | select(.name | endswith("_arm64.deb")) | .browser_download_url' \
          | xargs -I{} sh -c 'curl -L -o dists/stable/main/binary-arm64/$(basename "{}") "{}"'

      - name: Cleanup old versions
        working-directory: dists/stable/main/binary-arm64
        run: |
          shopt -s nullglob
          declare -A latest
          for f in *.deb; do
            base=${f%.deb}
            pkg=${base%%_*}
            rest=${base#*_}
            ver=${rest%_*}
            arch=${rest##*_}
            key="${pkg}_${arch}"
            if [ -z "${latest[$key]:-}" ] || dpkg --compare-versions "$ver" gt "${latest[$key]}"; then
              latest[$key]=$ver
            fi
          done
          for f in *.deb; do
            base=${f%.deb}
            pkg=${base%%_*}
            rest=${base#*_}
            ver=${rest%_*}
            arch=${rest##*_}
            if [ "$ver" != "${latest[${pkg}_${arch}]}" ]; then
              echo "Removing $f (keeping ${pkg}_${latest[${pkg}_${arch}]}_${arch}.deb)"
              rm -f "$f"
            fi
          done
      
      - name: Sign and publish
        run: |
          git config --global user.name "Robert"
          git config --global user.email "veloaddict@@users.noreply.github.com"
          chmod +x publish.sh
          ./publish.sh
